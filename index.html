<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS Import -->
    <link href="style.css" rel="stylesheet">
    <!-- Material Design 3 Import -->
    <!-- <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" /> -->
    <title>Admin Dashboard</title>
</head>

<body>
    <div class="main-container">
        <!-- Dashboard -->
        <section id="dashboard">
            <!-- Dashboard Logo -->
            <div class="dashboard-list container horizontal wfit hfit">
                <img src="logo" alt="logo">
                <h3>Dashboard</h3>
            </div>

            <nav class="dashboard-list">
                <ul>
                    <li>
                        <span class="material-symbols-outlined filled">home</span>
                        <a href="home">Home</a>
                    </li>
                    <li>
                        <span class="material-symbols-outlined filled">account_circle</span>
                        <a href="profile">Profile</a>
                    </li>
                    <li>
                        <span class="material-symbols-outlined filled">chat_bubble</span>
                        <a href="messages">Messages</a>
                    </li>
                    <li>
                        <span class="material-symbols-outlined filled">history</span>
                        <a href="history">History</a>
                    </li>
                    <li>
                        <span class="material-symbols-outlined filled">task</span>
                        <a href="tasks">Tasks</a>
                    </li>
                    <li>
                        <span class="material-symbols-outlined filled">communities</span>
                        <a href="communities">Communities</a>
                    </li>
                </ul>
            </nav>

            <!-- Lower List -->
            <nav class="dashboard-list">
                <ul>
                    <li>
                        <span class="material-symbols-outlined filled">settings</span>
                        <a href="settings">Settings</a>
                    </li>
                    <li>
                        <span class="material-symbols-outlined filled">live_help</span>
                        <a href="support">Support</a>
                    </li>
                    <li>
                        <span class="material-symbols-outlined filled">shield</span>
                        <a href="privacy">Privacy</a>
                    </li>
                </ul>
            </nav>
        </section>

        <!-- Header -->
        <header id="main-header">

            <!-- Top Header -->
            <div class="header-div">
                <div class="search-bar-section">
                    <!-- Search Bar -->
                    <span class="material-symbols-outlined empty">search</span>
                    <div id="search-bar"></div>
                </div>
                <div class="notification-section medium-gap">
                    <!-- Notification + Profile Pic + Name -->
                    <span class="material-symbols-outlined empty">Notifications_Active</span>
                    <img src="images/profilePicture.webp" alt="Profile Picture" class="profile-picture small">
                    <span>Morgan Oakley</span>
                </div>
            </div>

            <!-- Bottom Header -->
            <div class="header-div">
                <!-- Left side bottom header -->
                <div class="container horizontal medium-gap flex1">
                    <img src="images/profilePicture.webp" alt="Profile Picture" class="profile-picture medium">
                    <div class="container vertical small-gap">
                        <span class="small-text highlighted-text">Hi there,</span>
                        <h1 class="medium-text highlighted-text" small>Morgan Oakley (@morgan)</h1>
                    </div>
                </div>
                <!-- Right side bottom header -->
                <div class="container wfit hfill horizontal align-center medium-gap">
                    <button class="btn primary">New</button>
                    <button class="btn primary">Upload</button>
                    <button class="btn primary">Share</button>
                </div>
            </div>
        </header>
    </div>
</body>

</html>
